# Railway config-as-code — https://docs.railway.com/guides/config-as-code
# Service variables: deploy/HOSTING-RAILWAY-VERCEL.md

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "PYTHONPATH=src python scripts/run_phase6_server.py"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
