# Scheduled + manual corpus refresh: Phase 1 (P1-S6 = S1→S5) + Phase 2 index build.
# Scheduled runs commit the index bundle to main → Railway redeploys from GitHub.
# See docs/phase-wise-architecture.md §9.5 and deploy/HOSTING-RAILWAY-VERCEL.md §3.
# Local parity (no artifacts): python scripts/run_corpus_refresh_local.py
name: Corpus refresh

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish_to_railway:
        description: Commit index to main and push (triggers Railway deploy)
        type: boolean
        default: false
  schedule:
    # Daily 4:00 AM Pacific (America/Los_Angeles; DST-aware). Cadence per robots / policy (architecture §9.5).
    - cron: "0 4 * * *"
      timezone: "America/Los_Angeles"

concurrency:
  group: corpus-refresh-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ingest-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      # Optional: HF_TOKEN secret for higher Hub rate limits when downloading embedding weights.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Phase 0 config
        run: python scripts/validate_phase0.py

      - name: P1-S6 — manifest → raw → normalize → S5 flags (architecture §4.1)
        run: python scripts/ingestion/phase1/run_s6_pipeline.py --overwrite

      - name: Phase 2 — chunk, embed, FAISS index
        run: python scripts/run_phase2_build_index.py --overwrite

      - name: Upload Phase 2 index bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: phase2-index-${{ github.run_id }}
          path: data/phase2/index/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload run reports (optional, smaller)
        uses: actions/upload-artifact@v4
        with:
          name: phase1-reports-${{ github.run_id }}
          path: |
            data/phase1/runs/
            data/phase1/crawl_plans/
          if-no-files-found: warn
          retention-days: 14

      - name: Publish index to Railway (commit + push main)
        if: >
          github.ref == 'refs/heads/main' &&
          (
            github.event_name == 'schedule' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_to_railway == true)
          )
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/ci_commit_phase2_index.py
